name: Pipeline CI/CD - Atlas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------------
  # ETAPA 1 · Seguridad rápida y calidad de contenedores
  # -------------------------------------------------------------------
  seguridad-rapida:
    name: 1 · Diagnóstico rápido de seguridad y Docker
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Analizar Dockerfile con Hadolint (Backend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: BACKEND/Dockerfile

      - name: Analizar Dockerfile con Hadolint (Frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: FRONTEND/Dockerfile

  # -------------------------------------------------------------------
  # ETAPA 2 · Pruebas de código y análisis estático
  # -------------------------------------------------------------------
  pruebas-codigo:
    name: 2 · Pruebas de código, cobertura y SonarQube
    needs: [seguridad-rapida]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BACKEND/package-lock.json

      - name: Levantar solo PostgreSQL para pruebas de backend
        run: docker compose up -d --wait atlas-postgres-et

      - name: Ejecutar pruebas y cobertura en Backend
        run: |
          cd BACKEND
          npm ci
          npm test -- --runInBand

      - name: Análisis SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=false

  # -------------------------------------------------------------------
  # ETAPA 3 · Pruebas del sistema completo funcionando
  # -------------------------------------------------------------------
  pruebas-sistema:
    name: 3 · Sistema, aceptación, rendimiento y seguridad
    needs: [pruebas-codigo]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Construir y encender Atlas completo con Docker
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright y navegadores
        run: |
          cd pruebas-e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E con Playwright
        run: |
          cd pruebas-e2e
          npx playwright test

      - name: Ejecutar prueba de rendimiento con k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: pruebas-e2e/tests/performance.k6.js

      - name: Escaneo de seguridad dinámico API con OWASP ZAP
        run: |
          mkdir -p zap
          docker run --rm -v "${PWD}/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py -t http://host.docker.internal:4451/openapi.json -f openapi -O host.docker.internal:4451 -r zap-api.html -I || true

  # -------------------------------------------------------------------
  # ETAPA 4 · Publicar imágenes en GitHub Container Registry (GHCR)
  # -------------------------------------------------------------------
  publicar-imagenes:
    name: 4 · Publicar imágenes Docker en GHCR
    needs: [pruebas-sistema]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./BACKEND
          push: true
          tags: ghcr.io/${{ github.repository }}/atlas-backend:latest

      - name: Construir y publicar imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./FRONTEND
          push: true
          tags: ghcr.io/${{ github.repository }}/atlas-frontend:latest