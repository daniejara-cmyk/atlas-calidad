# =====================================================================
#  Pipeline de calidad de Atlas (Integración Continua)
#  Se ejecuta solo cada vez que alguien sube cambios o abre un Pull Request.
# =====================================================================
name: Calidad Atlas
 
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions
 
permissions:
  contents: read
 
jobs:
  # -------------------------------------------------------------------
  # ETAPA 1 · Revisiones rápidas (se ejecutan en paralelo)
  # -------------------------------------------------------------------
  secretos:
    name: 1a · Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # revisa TODO el historial, no solo el último cambio
      - name: Descargar Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Buscar contraseñas y claves expuestas
        run: ./gitleaks git . --redact -v
 
  dockerfiles:
    name: 1b · Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar Dockerfile del backend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: BACKEND/Dockerfile
      - name: Revisar Dockerfile del frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: FRONTEND/Dockerfile
 
  # -------------------------------------------------------------------
  # ETAPA 2 · Pruebas unitarias, de integración y análisis de código
  # -------------------------------------------------------------------
  pruebas-codigo:
    name: 2 · Unitarias + Integración (Jest) y SonarQube
    needs: [secretos, dockerfiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # SonarQube necesita el historial completo
 
      - name: Encender la base de datos de pruebas
        run: docker compose up -d --wait atlas-postgres-et
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
 
      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci
 
      - name: Ejecutar pruebas unitarias e integración con cobertura
        working-directory: BACKEND
        run: npm test -- --runInBand
 
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: BACKEND/coverage/
 
      - name: Ajustar rutas de cobertura para SonarQube
        run: sed -i 's#^SF:#SF:BACKEND/#' BACKEND/coverage/lcov.info
 
      - name: Análisis SonarQube Cloud y Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
 
  # -------------------------------------------------------------------
  # ETAPA 3 · Pruebas del sistema completo funcionando
  # -------------------------------------------------------------------
  pruebas-sistema:
    name: 3 · Sistema, aceptación, rendimiento y seguridad
    needs: [pruebas-codigo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Construir y encender Atlas completo con Docker
        run: docker compose up -d --build --wait
 
      - name: Esperar a que el frontend responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3351 > /dev/null && exit 0
            sleep 2
          done
          echo "El frontend no respondió a tiempo" && exit 1
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      # --- Sistema + aceptación + accesibilidad (Playwright) ---
      - name: Instalar Playwright
        working-directory: pruebas-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
 
      - name: Pruebas de sistema, aceptación y accesibilidad
        working-directory: pruebas-e2e
        run: npx playwright test
 
      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: pruebas-e2e/playwright-report/
 
      # --- Rendimiento (k6) ---
      - name: Prueba de rendimiento (perfil humo)
        run: |
          docker run --rm --network host \
            -v "$PWD/pruebas-rendimiento:/scripts" \
            grafana/k6:1.3.0 run -e PERFIL=humo /scripts/carga.js
 
      # --- Seguridad dinámica (OWASP ZAP) ---
      - name: Escaneo de seguridad ZAP (web y API)
        if: always()
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3351 -r zap-web.html -I
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:4451/openapi.json -f openapi -r zap-api.html -I
 
      - name: Guardar reportes de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-zap
          path: zap/
 
      - name: Apagar Atlas
        if: always()
        run: docker compose down -v
 
  # -------------------------------------------------------------------
  # ETAPA 4 · Entrega continua: publicar las imágenes aprobadas
  # Solo ocurre en la rama main y solo si TODO lo anterior salió bien.
  # -------------------------------------------------------------------
  publicar:
    name: 4 · Publicar imágenes Docker (GHCR)
    needs: [pruebas-sistema]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
 
      - name: Preparar nombre del dueño en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
 
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./BACKEND
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/atlas-backend:latest
            ghcr.io/${{ env.OWNER }}/atlas-backend:${{ github.sha }}
 
      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FRONTEND
          push: true
          build-args: |
            VITE_API_URL=http://localhost:4451
          tags: |
            ghcr.io/${{ env.OWNER }}/atlas-frontend:latest
            ghcr.io/${{ env.OWNER }}/atlas-frontend:${{ github.sha }}